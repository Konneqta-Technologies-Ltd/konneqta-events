name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm available early)
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@12.4.1 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run lint
        run: pnpm run lint

      - name: Run type-check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build
